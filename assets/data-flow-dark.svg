  <g>
    <rect x="632" y="120" width="152" height="426" rx="12" fill="#15151c" stroke="#3a3a48" stroke-width="1"/>
    <g transform="translate(695 281) scale(1.083333)" fill="none" stroke="#a0a0b4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7.4"/>
      <circle cx="12" cy="12" r="2.9"/>
      <g stroke-width="1.9">
