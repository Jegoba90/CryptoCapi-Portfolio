      <path d="M9.4,6.2 V3.2"/>
      <path d="M12,6.2 V3.2"/>
      <path d="M14.6,6.2 V3.2"/>
      <path d="M9.4,17.8 V20.8"/>
      <path d="M12,17.8 V20.8"/>
      <path d="M14.6,17.8 V20.8"/>
      <path d="M6.2,9.4 H3.2"/>
      <path d="M6.2,12 H3.2"/>
      <path d="M6.2,14.6 H3.2"/>
