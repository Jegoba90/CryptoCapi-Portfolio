    <rect x="246" y="274" width="316" height="118" rx="12" fill="#15151c"/>
    <rect x="246" y="274" width="316" height="118" rx="12" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.42" stroke-width="1"/>
