    <text x="308" y="166" font-size="12" fill="#8e8ea3">Z-Score · Bollinger · sentimiento</text>
    <rect x="308" y="178" width="134" height="20" rx="6" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1"/>
    <text x="375" y="192" font-size="10.5" text-anchor="middle" fill="#a78bfa">LLM + override Python</text>
    <rect x="450" y="178" width="88" height="20" rx="6" fill="none" stroke="#2a2a35" stroke-width="1"/>
    <text x="494" y="192" font-size="10" text-anchor="middle" fill="#8e8ea3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">process_seal</text>
  </g>

