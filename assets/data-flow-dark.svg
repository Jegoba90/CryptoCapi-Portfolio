    <text x="46" y="493" font-size="13" font-weight="600" fill="#e9e9f2">On-chain + precios</text>
    <g font-size="10.5" fill="#8e8ea3">
      <text x="46" y="512">Alchemy · Mempool.space</text>
      <text x="46" y="529">Yahoo · CoinGecko</text>
    </g>
  </g>

  <!-- MOTOR RADAR: el unico con LLM -->
  <g>
    <rect x="246" y="100" width="316" height="118" rx="12" fill="#15151c"/>
    <rect x="246" y="100" width="316" height="118" rx="12" fill="#a78bfa" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.42" stroke-width="1"/>
    <rect x="262" y="119" width="34" height="34" rx="9" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1"/>
