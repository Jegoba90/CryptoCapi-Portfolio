<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 628" width="1160" height="628" role="img" aria-labelledby="ttl desc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="ttl">CryptoCapi · Flujo de Datos</title>
  <desc id="desc">Tres pipelines independientes en Python. Motor Radar consume noticias Tier 1 y precios, y es el único que invoca un LLM (con override determinista posterior). Motor Quant PRO consume velas de Binance y Motor Quant Plus lee la blockchain por RPC; ambos son 100% deterministas, sin LLM. Radar y Quant Plus empujan sus resultados a la API Express; a Quant PRO lo consulta la API on-demand. La API es la única que persiste en PostgreSQL serverless, cachea en Redis y sirve al frontend.</desc>

  <defs>
    <marker id="aRadar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.2 L7,4 L1,6.8 Z" fill="#a78bfa"/>
    </marker>
    <marker id="aPro" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.2 L7,4 L1,6.8 Z" fill="#34d399"/>
    </marker>
    <marker id="aProRev" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M7,1.2 L1,4 L7,6.8 Z" fill="#34d399"/>
    </marker>
    <marker id="aPlus" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.2 L7,4 L1,6.8 Z" fill="#22d3ee"/>
    </marker>
    <marker id="aNeu" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1.2 L7,4 L1,6.8 Z" fill="#5a5a6e"/>
    </marker>
    <marker id="aNeuRev" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M7,1.2 L1,4 L7,6.8 Z" fill="#5a5a6e"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1159" height="627" rx="16" fill="#0d0d12" stroke="#22222c" stroke-width="1"/>

  <!-- etiquetas de carril en cajas -->
  <g>
    <g fill="#1c1c25" stroke="#2f2f3b" stroke-width="1">
      <rect x="79" y="24" width="78" height="20" rx="6"/>
      <rect x="333" y="24" width="142" height="20" rx="6"/>
      <rect x="644" y="24" width="128" height="20" rx="6"/>
      <rect x="840" y="24" width="110" height="20" rx="6"/>
      <rect x="1028" y="24" width="74" height="20" rx="6"/>
    </g>
    <g font-size="10" font-weight="600" letter-spacing="1" fill="#9a9aae" text-anchor="middle">
      <text x="118" y="38">FUENTES</text>
      <text x="404" y="38">MOTORES · PYTHON</text>
      <text x="708" y="38">API · TYPESCRIPT</text>
      <text x="895" y="38">PERSISTENCIA</text>
      <text x="1065" y="38">CLIENTE</text>
    </g>
  </g>

  <!-- conexiones -->
  <g fill="none" stroke-width="1.8" stroke-linecap="round">
    <!-- fuentes hacia cada motor -->
    <path d="M209,159 H243" stroke="#a78bfa" marker-end="url(#aRadar)"/>
    <path d="M209,333 H243" stroke="#34d399" marker-end="url(#aPro)"/>
    <path d="M209,507 H243" stroke="#22d3ee" marker-end="url(#aPlus)"/>
    <!-- motores hacia la API: Radar y Plus empujan, a PRO lo consulta la API -->
    <path d="M565,159 H629" stroke="#a78bfa" marker-end="url(#aRadar)"/>
    <path d="M565,333 H629" stroke="#34d399" marker-end="url(#aPro)" marker-start="url(#aProRev)"/>
    <path d="M565,507 H629" stroke="#22d3ee" marker-end="url(#aPlus)"/>
    <!-- la API es la unica que persiste y cachea -->
    <path d="M787,193 H817" stroke="#5a5a6e" marker-end="url(#aNeu)" marker-start="url(#aNeuRev)"/>
    <path d="M787,473 H817" stroke="#5a5a6e" marker-end="url(#aNeu)" marker-start="url(#aNeuRev)"/>
    <!-- API hacia el cliente: pasa entre los dos almacenes -->
    <path d="M787,333 H997" stroke="#5a5a6e" marker-end="url(#aNeu)"/>
  </g>
  <g font-size="9.5" fill="#8e8ea3" text-anchor="middle">
    <text x="597" y="150">push</text>
    <text x="597" y="324">on-demand</text>
    <text x="597" y="498">push</text>
  </g>

